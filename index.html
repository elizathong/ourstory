<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Our Story</title>
<style>
  :root{
    --bg-1:#2b2440;
    --bg-2:#4a3b63;
    --coral:#ff6f91;
    --coral-dark:#d9506f;
    --cream:#f7ead0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;min-height:100%;
    background:linear-gradient(180deg,var(--bg-1),var(--bg-2));
    font-family:'Segoe UI',system-ui,sans-serif;
    color:var(--cream);
    overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
  }
  #app{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 16px; }
  h1{ font-size:22px; letter-spacing:2px; color:var(--coral); text-shadow:2px 2px 0 rgba(0,0,0,.4); margin:0 0 4px; text-align:center; }
  p.sub{ font-size:15px; opacity:.8; margin:0 0 24px; text-align:center; }
  #step-label{ font-size:13px; opacity:.65; margin-bottom:14px; text-transform:uppercase; letter-spacing:1px; text-align:center; }
  #charGrid{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; width:100%; max-width:340px; }
  .charCard{
    background:rgba(255,255,255,.06); border:3px solid transparent; border-radius:14px;
    padding:14px 8px 10px; display:flex; flex-direction:column; align-items:center; gap:8px;
    cursor:pointer; transition:transform .15s, border-color .15s, background .15s;
  }
  .charCard:active{ transform:scale(.96); }
  .charCard.selected{ border-color:var(--coral); background:rgba(255,111,145,.15); }
  .charCard .portrait{
    width:64px; height:128px; image-rendering:pixelated;
    background-repeat:no-repeat; background-size:256px 128px; background-position:0 0;
  }
  .charCard .name{ font-size:15px; font-weight:600; }
  #nameField{
    width:100%; max-width:340px; margin-top:22px;
    display:none; flex-direction:column; align-items:center; gap:8px;
  }
  #nameField label{ font-size:13px; opacity:.7; text-transform:uppercase; letter-spacing:1px; }
  #nameInput{
    width:100%; max-width:260px; text-align:center; font-size:17px;
    background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.2); border-radius:10px;
    color:var(--cream); padding:10px 14px; font-family:inherit;
  }
  #nameInput:focus{ outline:none; border-color:var(--coral); }
  #confirmBtn{
    margin-top:26px; font-size:15px; font-weight:600; letter-spacing:1px;
    background:var(--coral); color:#2a1030; border:none; padding:14px 34px;
    border-radius:30px; cursor:pointer; box-shadow:0 4px 0 var(--coral-dark);
    opacity:.35; pointer-events:none; transition:opacity .2s;
  }
  #confirmBtn.ready{ opacity:1; pointer-events:auto; }
  #confirmBtn:active{ transform:translateY(2px); box-shadow:0 2px 0 var(--coral-dark); }

  /* ---------- Room / game ---------- */
  #gameScreen{ display:none; flex-direction:column; align-items:center; margin:0 -16px; }
  #roomLabel{ font-size:14px; opacity:.75; margin-bottom:10px; text-align:center; letter-spacing:1px; }
  #canvasWrap{ display:grid; width:min(352px, calc(100vw - 8px)); }
  #canvasWrap > *{ grid-area:1 / 1; }
  #gameCanvas{
    width:100%; aspect-ratio:352/320;
    image-rendering:pixelated; border:4px solid rgba(255,255,255,.15); border-radius:12px;
    background:#000; touch-action:none;
  }
  #fadeOverlay{
    width:100%; height:100%; border-radius:12px;
    background:#000; opacity:0; pointer-events:none;
  }
  #controlRow{
    display:flex; align-items:center; justify-content:space-between;
    width:min(352px, calc(100vw - 8px)); margin-top:26px;
  }
  #dpad{ position:relative; width:132px; height:132px; }
  .dbtn{
    position:absolute; width:44px; height:44px; background:rgba(255,255,255,.1);
    border:2px solid rgba(255,255,255,.25); border-radius:10px; color:var(--cream);
    display:flex; align-items:center; justify-content:center; font-size:20px;
    touch-action:none; -webkit-tap-highlight-color:transparent; cursor:pointer;
  }
  .dbtn:active, .dbtn.pressed{ background:var(--coral); border-color:var(--coral); color:#2a1030; }
  #dbtn-up{ top:0; left:44px; }
  #dbtn-down{ top:88px; left:44px; }
  #dbtn-left{ top:44px; left:0; }
  #dbtn-right{ top:44px; left:88px; }
  #actionPad{ position:relative; width:112px; height:84px; }
  .abtn{
    position:absolute; width:48px; height:48px; border-radius:50%;
    background:rgba(255,255,255,.1); border:2px solid rgba(255,255,255,.25); color:var(--cream);
    display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:700;
    touch-action:none; -webkit-tap-highlight-color:transparent; cursor:pointer;
  }
  .abtn:active, .abtn.pressed{ background:var(--coral); border-color:var(--coral); color:#2a1030; }
  #abtn-a{ top:0; right:0; }
  #abtn-b{ top:32px; right:54px; }

  #toolRow{ display:flex; gap:10px; margin-top:14px; }
  .toolBtn{
    font-size:12px; background:rgba(255,255,255,.1); color:var(--cream);
    border:1px solid rgba(255,255,255,.25); border-radius:8px; padding:7px 12px; cursor:pointer;
  }
  .toolBtn.active{ background:var(--coral); color:#2a1030; border-color:var(--coral); }
</style>
</head>
<body>
<div id="app">
  <h1>OUR STORY</h1>
  <p class="sub">choose your character &#9829;</p>
  <div id="charGrid"></div>
  <div id="nameField">
    <label for="nameInput">Name your character</label>
    <input id="nameInput" type="text" maxlength="16" autocomplete="off" placeholder="e.g. Eliza">
  </div>
  <button id="confirmBtn">Start</button>
  <div id="gameScreen">
    <div id="roomLabel"></div>
    <div id="canvasWrap">
      <canvas id="gameCanvas" width="352" height="320"></canvas>
      <div id="fadeOverlay"></div>
    </div>
    <div id="controlRow">
      <div id="dpad">
        <div class="dbtn" id="dbtn-up">&#9650;</div>
        <div class="dbtn" id="dbtn-left">&#9664;</div>
        <div class="dbtn" id="dbtn-right">&#9654;</div>
        <div class="dbtn" id="dbtn-down">&#9660;</div>
      </div>
      <div id="actionPad">
        <div class="abtn" id="abtn-b">B</div>
        <div class="abtn" id="abtn-a">A</div>
      </div>
    </div>
    <div id="toolRow">
      <button class="toolBtn" id="collisionToggleBtn">Show Collision</button>
    </div>
  </div>
</div>

const NAMES = Object.keys(CHAR_DATA);
let youChar = null;

const grid = document.getElementById('charGrid');
const nameField = document.getElementById('nameField');
const nameInput = document.getElementById('nameInput');
const confirmBtn = document.getElementById('confirmBtn');

function updateReady(){
  confirmBtn.classList.toggle('ready', !!youChar && nameInput.value.trim().length > 0);
}

function render(){
  grid.innerHTML = '';
  NAMES.forEach(name=>{
    const card = document.createElement('div');
    card.className = 'charCard';
    if(name===youChar) card.classList.add('selected');
    card.innerHTML = `<div class="portrait" style="background-image:url('${CHAR_DATA[name]}')"></div><div class="name">${name}</div>`;
    card.addEventListener('click', ()=>{
      youChar = name;
      nameField.style.display = 'flex';
      if(!nameInput.value) nameInput.value = name;
      render();
      updateReady();
    });
    grid.appendChild(card);
  });
}
render();

nameInput.addEventListener('input', updateReady);

confirmBtn.addEventListener('click', ()=>{
  if(!youChar || !nameInput.value.trim()) return;
  playerName = nameInput.value.trim();
  document.getElementById('app').querySelectorAll(':scope > *:not(#gameScreen)').forEach(el=>el.style.display='none');
  document.getElementById('gameScreen').style.display = 'flex';
  document.getElementById('roomLabel').textContent = playerName + "'s Room";
  PLAYER_RUN = RUN_DATA[youChar];
  PLAYER_IDLE = IDLE_DATA_IMG[youChar];
  startGame();
});

let currentMapId = 'room';

let roomGrid = [];

function rebuildGrid(){
  const map = MAPS[currentMapId];
  roomGrid = [];
  for(let y=0;y<map.h;y++) roomGrid.push(map.baseCollision[y].slice());
  (map.props||[]).forEach(p=>{
    if(p.walkable) return;
    for(let yy=p.y; yy<p.y+p.hT; yy++) for(let xx=p.x; xx<p.x+p.wT; xx++){
      if(yy>=0 && yy<map.h && xx>=0 && xx<map.w) roomGrid[yy][xx] = 1;
    }
  });
  (map.manualWalls||[]).forEach(([x,y])=>{
    if(y>=0 && y<map.h && x>=0 && x<map.w) roomGrid[y][x] = 1;
  });
}

function isBlocked(cx,cy){
  const map = MAPS[currentMapId];
  if(cx<0||cy<0||cx>=map.w||cy>=map.h) return true;
  return roomGrid[cy][cx] === 1;
}

function enterMap(id, spawnX, spawnY, spawnFacing){
  currentMapId = id;
  const map = MAPS[id];
  map.props = map.defaultProps.map(p=>({...p}));
  map.manualWalls = [];
  rebuildGrid();
  player.x = spawnX; player.y = spawnY;
  player.px = spawnX*TILE; player.py = spawnY*TILE;
  player.targetPx = player.px; player.targetPy = player.py;
  player.facing = spawnFacing;
  player.moving = false;
  const label = document.getElementById('roomLabel');
  if(label) label.textContent = playerName + "'s " + MAPS[id].label;
}

const DIRS = ['down','up','left','right'];
// sprite sheet column order is right,up,left,down (not the same as DIRS above)
const DIR_COL = {right:0, up:1, left:2, down:3};
let player = { x:3, y:8, px:3*TILE, py:8*TILE, targetPx:3*TILE, targetPy:8*TILE, facing:'up', moving:false };
let keysDown = {};
let gameCanvas, gctx, fadeOverlayEl;

let transition = null; // {phase:'out'|'in', start, duration, onMid}

function startTransition(onMid){
  if(transition) return;
  transition = { phase:'out', start:performance.now(), duration:220, onMid };
}

let pendingDoorAction = null;

function tryMove(dir){
  if(player.moving || transition) return;
  player.facing = dir;
  const map = MAPS[currentMapId];
  const warp = (map.warps||[]).find(w=>w.x===player.x && w.y===player.y && w.dir===dir);
  if(warp){
    let dx=0, dy=0;
    if(dir==='up') dy=-1; else if(dir==='down') dy=1;
    else if(dir==='left') dx=-1; else if(dir==='right') dx=1;
    const nx = Math.max(0, Math.min(map.w-1, player.x+dx));
    const ny = Math.max(0, Math.min(map.h-1, player.y+dy));
    pendingDoorAction = ()=> enterMap(warp.to, warp.spawnX, warp.spawnY, warp.spawnFacing);
    player.x = nx; player.y = ny;
    player.targetPx = nx*TILE; player.targetPy = ny*TILE;
    player.moving = true;
    return;
  }
  let dx=0, dy=0;
  if(dir==='up') dy=-1; else if(dir==='down') dy=1;
  else if(dir==='left') dx=-1; else if(dir==='right') dx=1;
  const nx = player.x+dx, ny = player.y+dy;
  if(isBlocked(nx,ny)) return;
  player.x=nx; player.y=ny;
  player.targetPx = nx*TILE; player.targetPy = ny*TILE;
  player.moving = true;
}

function computeCamera(){
  const map = MAPS[currentMapId];
  const mapWpx = map.w*TILE, mapHpx = map.h*TILE;
  const viewWpx = VIEW_W*TILE, viewHpx = VIEW_H*TILE;
  let camX, camY;
  if(mapWpx <= viewWpx) camX = (mapWpx-viewWpx)/2;
  else camX = Math.max(0, Math.min(player.px+TILE/2-viewWpx/2, mapWpx-viewWpx));
  if(mapHpx <= viewHpx) camY = (mapHpx-viewHpx)/2;
  else camY = Math.max(0, Math.min(player.py+TILE/2-viewHpx/2, mapHpx-viewHpx));
  return {camX,camY};
}

function updatePlayer(){
  const speed = 4;
  if(player.moving){
    if(player.px<player.targetPx) player.px=Math.min(player.px+speed, player.targetPx);
    if(player.px>player.targetPx) player.px=Math.max(player.px-speed, player.targetPx);
    if(player.py<player.targetPy) player.py=Math.min(player.py+speed, player.targetPy);
    if(player.py>player.targetPy) player.py=Math.max(player.py-speed, player.targetPy);
    if(player.px===player.targetPx && player.py===player.targetPy){
      player.moving=false;
      if(pendingDoorAction){
        const action = pendingDoorAction;
        pendingDoorAction = null;
        startTransition(action);
      }
    }
  }
}

function handleInput(){
  if(keysDown['ArrowUp']) tryMove('up');
  else if(keysDown['ArrowDown']) tryMove('down');
  else if(keysDown['ArrowLeft']) tryMove('left');
  else if(keysDown['ArrowRight']) tryMove('right');
}

function drawPlayer(ctx){
  const dirIdx = DIR_COL[player.facing];
  const dw = NATIVE*SCALE, dh = 32*SCALE;
  const dx = player.px, dy = player.py - (dh - TILE); // anchor feet to tile
  ctx.imageSmoothingEnabled = false;
  if(player.moving && PLAYER_RUN.complete){
    const frame = Math.floor(Date.now()/90)%6;
    const sx = (dirIdx*6 + frame) * NATIVE;
    ctx.drawImage(PLAYER_RUN, sx,0,NATIVE,32, dx,dy,dw,dh);
  } else if(PLAYER_IDLE.complete){
    const sx = dirIdx*NATIVE;
    ctx.drawImage(PLAYER_IDLE, sx,0,NATIVE,32, dx,dy,dw,dh);
  }
}

function draw(){
  gctx.imageSmoothingEnabled = false;
  gctx.fillStyle = '#000';
  gctx.fillRect(0,0,gameCanvas.width,gameCanvas.height);
  const map = MAPS[currentMapId];
  const {camX,camY} = computeCamera();
  gctx.save();
  gctx.translate(-camX,-camY);
  gctx.drawImage(map.bg, 0,0,map.w*NATIVE,map.h*NATIVE, 0,0,map.w*TILE,map.h*TILE);
  (map.props||[]).filter(p=>p.walkable).forEach(d=>{
    const img = TILE_IMG[d.img];
    gctx.drawImage(img, 0,0,d.wT*NATIVE,d.hT*NATIVE, d.x*TILE, d.y*TILE, d.wT*TILE, d.hT*TILE);
  });
  const drawables = (map.props||[]).filter(p=>!p.walkable).map(p=>({...p, sortY:p.y+p.hT}));
  drawables.push({sortY:player.y+1, isPlayer:true});
  drawables.sort((a,b)=>a.sortY-b.sortY);
  drawables.forEach(d=>{
    if(d.isPlayer){ drawPlayer(gctx); return; }
    const img = TILE_IMG[d.img];
    gctx.drawImage(img, 0,0,d.wT*NATIVE,d.hT*NATIVE, d.x*TILE, d.y*TILE, d.wT*TILE, d.hT*TILE);
  });
  if(debugCollision){
    gctx.fillStyle = 'rgba(255,0,60,.45)';
    for(let y=0;y<map.h;y++) for(let x=0;x<map.w;x++){
      if(roomGrid[y][x]===1) gctx.fillRect(x*TILE, y*TILE, TILE, TILE);
    }
  }
  gctx.restore();
}

function loop(){
  if(transition){
    const now = performance.now();
    const t = Math.min(1, (now - transition.start) / transition.duration);
    draw();
    const alpha = transition.phase === 'out' ? t : 1 - t;
    fadeOverlayEl.style.opacity = alpha;
    if(t >= 1){
      if(transition.phase === 'out'){
        transition.onMid();
        transition.phase = 'in';
        transition.start = now;
      } else {
        transition = null;
      }
    }
  } else {
    handleInput();
    updatePlayer();
    draw();
  }
  requestAnimationFrame(loop);
}

function bindHold(el, onDown, onUp){
  el.addEventListener('pointerdown', e=>{ e.preventDefault(); el.classList.add('pressed'); onDown(); });
  el.addEventListener('pointerup', ()=>{ el.classList.remove('pressed'); onUp(); });
  el.addEventListener('pointerleave', ()=>{ el.classList.remove('pressed'); onUp(); });
  el.addEventListener('pointercancel', ()=>{ el.classList.remove('pressed'); onUp(); });
}

let debugCollision = false;

function initEditor(){
  document.getElementById('collisionToggleBtn').addEventListener('click', ()=>{
    debugCollision = !debugCollision;
    document.getElementById('collisionToggleBtn').classList.toggle('active', debugCollision);
  });
}

function startGame(){
  gameCanvas = document.getElementById('gameCanvas');
  gctx = gameCanvas.getContext('2d');
  fadeOverlayEl = document.getElementById('fadeOverlay');
  const spawn = MAPS.room.spawn;
  enterMap('room', spawn.x, spawn.y, spawn.facing);
  window.addEventListener('keydown', e=>{
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) e.preventDefault();
    keysDown[e.key]=true;
  });
  window.addEventListener('keyup', e=>{ keysDown[e.key]=false; });
  bindHold(document.getElementById('dbtn-up'),    ()=>keysDown['ArrowUp']=true,    ()=>keysDown['ArrowUp']=false);
  bindHold(document.getElementById('dbtn-down'),  ()=>keysDown['ArrowDown']=true,  ()=>keysDown['ArrowDown']=false);
  bindHold(document.getElementById('dbtn-left'),  ()=>keysDown['ArrowLeft']=true,  ()=>keysDown['ArrowLeft']=false);
  bindHold(document.getElementById('dbtn-right'), ()=>keysDown['ArrowRight']=true, ()=>keysDown['ArrowRight']=false);
  // A/B are visual only for now - not wired to anything yet
  bindHold(document.getElementById('abtn-a'), ()=>{}, ()=>{});
  bindHold(document.getElementById('abtn-b'), ()=>{}, ()=>{});
  initEditor();
  loop();
}
