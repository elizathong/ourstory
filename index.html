<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Our Story</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --dusk-1:#241a35;
    --dusk-2:#4a3b63;
    --coral:#ff6f91;
    --coral-dark:#d9506f;
    --cream:#f7ead0;
    --parchment:#fff3d6;
    --parchment-border:#6b4423;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;
    background:linear-gradient(180deg,var(--dusk-1),var(--dusk-2));
    font-family:'VT323',monospace;
    color:var(--cream);
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    display:flex;align-items:center;justify-content:center;
  }
  #app{ position:relative; width:100%; max-width:900px; }

  /* ---------- Game ---------- */
  #gameWrap{ display:none; flex-direction:column; align-items:center; width:100%; padding:0 8px; }
  #canvasColumn{ display:flex; flex-direction:column; align-items:center; width:100%; max-width:416px; }
  #rotateHint{ font-size:13px; opacity:.6; margin-top:4px; text-align:center; }
  #gameCanvas{ border:4px solid #241a35; border-radius:10px; background:#000; width:100%; max-width:416px; height:auto; display:block; touch-action:none; }
  #hint{ font-size:16px; opacity:.7; margin-top:6px; height:18px; text-align:center; }

  #chapterBanner{
    position:absolute; top:18px; left:50%; transform:translateX(-50%);
    background:rgba(20,12,30,.85); border:2px solid var(--coral);
    padding:8px 20px; border-radius:8px; font-family:'Press Start 2P',monospace;
    font-size:12px; color:var(--cream); text-align:center; opacity:0; transition:opacity .5s;
    pointer-events:none; white-space:nowrap;
  }

  #dialogueBox{
    display:none; width:100%; max-width:416px; box-sizing:border-box;
    background:var(--parchment); color:#2a1a0a;
    border:4px solid var(--parchment-border); border-radius:10px; padding:10px 16px;
    font-size:20px; line-height:1.25; margin-top:8px;
  }
  #dialogueBox .who{ font-family:'Press Start 2P',monospace; font-size:9px; color:var(--coral-dark); margin-bottom:4px; display:block;}
  #dialogueBox .cont{ float:right; font-size:14px; opacity:.6; }

  #fade{
    position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .35s;
  }

  #endingScreen{
    display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; text-align:center; padding:40px;
  }
  #endingScreen h2{ font-family:'Press Start 2P',monospace; color:var(--coral); font-size:18px; }
  #endingScreen p{ font-size:26px; max-width:520px; }
  .heartIcon{ color:var(--coral); }

  /* ---------- Touch controls ---------- */
  #touchControls{
    display:none; width:100%; max-width:416px; margin-top:10px;
    align-items:center; justify-content:space-between; user-select:none;
  }
  #dpad{
    position:relative; width:130px; height:130px; flex-shrink:0;
  }
  .dbtn{
    position:absolute; width:44px; height:44px; background:rgba(255,255,255,.14);
    border:2px solid rgba(255,255,255,.35); border-radius:10px; color:var(--cream);
    display:flex; align-items:center; justify-content:center; font-size:20px;
    touch-action:none; -webkit-tap-highlight-color:transparent;
  }
  .dbtn:active, .dbtn.pressed{ background:var(--coral); border-color:var(--coral); color:#2a1030; }
  #dbtn-up{ top:0; left:43px; }
  #dbtn-down{ top:86px; left:43px; }
  #dbtn-left{ top:43px; left:0; }
  #dbtn-right{ top:43px; left:86px; }

  #interactBtn{
    width:74px; height:74px; border-radius:50%; background:var(--coral);
    border:3px solid var(--coral-dark); color:#2a1030; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-family:'Press Start 2P',monospace;
    font-size:9px; line-height:1.4; touch-action:none; flex-shrink:0;
  }
  #interactBtn:active, #interactBtn.pressed{ background:var(--coral-dark); }
  #interactBtn .heartIcon{ font-size:16px; }
  /* ---------- Landscape phone layout ---------- */
  @media (orientation: landscape) and (max-height: 500px){
    #rotateHint{ display:none; }
    #gameWrap{ flex-direction:row; align-items:center; justify-content:center; gap:14px; }
    #touchControls{ display:contents; }
    #dpad{ order:1; }
    #canvasColumn{ order:2; width:auto; max-width:none; }
    #interactBtn{ order:3; }
    #gameCanvas{ width:auto; height:min(78vh,340px); max-width:none; }
    #hint{ font-size:11px; margin-top:3px; }
    #debugToggle, #bmSkip{ font-size:11px; margin-top:0; }
    #dialogueBox{ max-width:340px; font-size:16px; padding:6px 10px; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ============ GAME ============ -->
  <div id="gameWrap">
    <div id="canvasColumn">
      <canvas id="gameCanvas" width="416" height="288"></canvas>
      <div id="dialogueBox"><span class="who"></span><span class="text"></span><span class="cont">&#9660; tap</span></div>
      <div id="hint">Use the pad to walk &middot; tap the heart to interact</div>
      <div id="rotateHint">&#8635; tip: turn your phone sideways for a bigger view</div>
      <div id="debugToggle" style="font-size:13px;opacity:.55;margin-top:2px;cursor:pointer;text-decoration:underline;">show blocked areas (debug)</div>
      <div id="bmSkip" style="display:none;font-size:13px;opacity:.6;margin-top:2px;cursor:pointer;text-decoration:underline;">skip mini-game</div>
    </div>
    <div id="touchControls">
      <div id="dpad">
        <div class="dbtn" id="dbtn-up">&#9650;</div>
        <div class="dbtn" id="dbtn-left">&#9664;</div>
        <div class="dbtn" id="dbtn-right">&#9654;</div>
        <div class="dbtn" id="dbtn-down">&#9660;</div>
      </div>
      <div id="interactBtn"><span class="heartIcon">&#9829;</span><span>TALK</span></div>
    </div>
  </div>

  <div id="chapterBanner"></div>
  <div id="endingScreen">
    <h2>THE END <span class="heartIcon">&#9829;</span></h2>
    <p id="endingText"></p>
  </div>
  <div id="fade"></div>

</div>

   Replace every [BRACKETED] placeholder with your real story. Nothing

/* ---------------- Small helper: rounded rectangle path ---------------- */
function rr(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

   0 face-S 1 face-N 2 face-W(mirror=E) 3-4 walk-S 5-6 walk-N 7-8 walk-W(mirror=E) */

const SPRITE_FW = 16, SPRITE_FH = 32;
const SPRITE_FRAMES = {
  down:  { idle: 0, walk: [3,4] },
  up:    { idle: 1, walk: [5,6] },
  left:  { idle: 2, walk: [7,8] },
  right: { idle: 2, walk: [7,8], mirror: true }
};

function drawCharacter(ctx, x, y, scale, facing, walking){
  if(!PLAYER_SPRITE.complete) return;
  const set = SPRITE_FRAMES[facing] || SPRITE_FRAMES.down;
  const frame = walking ? set.walk[Math.floor(Date.now()/150)%2] : set.idle;
  const sx = frame * SPRITE_FW;
  const dw = SPRITE_FW*scale, dh = SPRITE_FH*scale;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if(set.mirror){
    ctx.translate(x+dw, y);
    ctx.scale(-1,1);
    ctx.drawImage(PLAYER_SPRITE, sx, 0, SPRITE_FW, SPRITE_FH, 0, 0, dw, dh);
  } else {
    ctx.drawImage(PLAYER_SPRITE, sx, 0, SPRITE_FW, SPRITE_FH, x, y, dw, dh);
  }
  ctx.restore();
}

/* small nameplate bubble shown above the player in-game, Gather-style */
function drawNameTag(ctx, worldX, worldY, label){
  ctx.save();
  ctx.font = "bold 10px 'VT323', monospace";
  ctx.textBaseline = "middle";
  const textW = ctx.measureText(label).width;
  const w = textW + 22, h = 17;
  const tx = worldX - w/2, ty = worldY - h;
  ctx.fillStyle = "rgba(28,22,34,0.88)";
  rr(ctx, tx, ty, w, h, 8); ctx.fill();
  ctx.fillStyle = "#7ee081";
  ctx.beginPath(); ctx.ellipse(tx+11, ty+h/2, 3.2, 3.2, 0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = "#f7ead0";
  ctx.fillText(label, tx+19, ty+h/2+1);
  ctx.restore();
}

function buildOutdoorMap(w,h,{ water=[], building=[], flowers=[], doors=[] }={}){
  const grid = [];
  for(let y=0;y<h;y++){
    const row = [];
    for(let x=0;x<w;x++) row.push( (x===0||y===0||x===w-1||y===h-1) ? 2 : 0 );
    grid.push(row);
  }
  const midL = Math.floor(w/2)-1, midR = Math.floor(w/2);
  for(let y=1;y<h-1;y++){ grid[y][midL]=1; grid[y][midR]=1; }
  water.forEach(([x,y])=>{ grid[y][x]=3; });
  building.forEach(([x,y])=>{ grid[y][x]=4; });
  flowers.forEach(([x,y])=>{ grid[y][x]=5; });
  const exits = [];
  doors.forEach(([x,y,to,entry])=>{ grid[y][x]=6; exits.push({x,y,to,entry}); });
  return { grid, exits };
}

function rect(x0,y0,x1,y1){ const out=[]; for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) out.push([x,y]); return out; }

function isBlocked(cx,cy){
  if(cy<0||cy>=map.h||cx<0||cx>=map.w) return true;
  const t = map.grid[cy][cx];
  if(t===2||t===3||t===4||t===8) return true; // 9 (stairs) is intentionally walkable
  if(map.objs.some(o=>o.x===cx && o.y===cy)) return true;
  return false;
}

function enterMap(idx, entryOverride){
  currentMap = idx;
  map = MAPS[idx];
  const raw = entryOverride || map.entry;
  // safety clamp: never let a bad coordinate spawn the player outside this map's bounds
  const entryPoint = [
    Math.max(1, Math.min(map.w-2, raw[0])),
    Math.max(1, Math.min(map.h-2, raw[1]))
  ];
  player.x = entryPoint[0]; player.y = entryPoint[1];
  player.px = player.x*TILE; player.py = player.y*TILE;
  player.facing = 'down'; player.moving = false;
  if(map.storyIndex !== undefined){
    const ch = STORY.chapters[map.storyIndex];
    showBanner(ch.title + " — " + ch.subtitle);
  } else if(map.banner){
    showBanner(map.banner);
  }
}

function showBanner(text){
  const b = document.getElementById('chapterBanner');
  b.textContent = text;
  b.style.opacity = 1;
  clearTimeout(showBanner._t);
  showBanner._t = setTimeout(()=>{ b.style.opacity = 0; }, 2200);

window.addEventListener('keydown', e=>{
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," ","Spacebar"].includes(e.key)) e.preventDefault();
  keysDown[e.key] = true;
  if(e.key === " " || e.key === "Spacebar") handleSpace();
});
window.addEventListener('keyup', e=>{ keysDown[e.key] = false; });

function handleSpace(){
  if(gameEnded) return;
  if(mode === 'badminton'){ swingRacket(); return; }
  if(dialogueActive){
    dialogueIndex++;
    if(dialogueIndex >= dialogueLines.length) closeDialogue();
    else renderDialogueLine();
    return;
  }
  let fx=player.x, fy=player.y;
  if(player.facing==='down') fy++; else if(player.facing==='up') fy--;
  else if(player.facing==='left') fx--; else if(player.facing==='right') fx++;
  const obj = map.objs.find(o=>o.x===fx && o.y===fy);
  if(obj) openDialogueFor(obj);
}

let pendingEndingText = null;

function openDialogueFor(obj){
  pendingEndingText = null;
  if(obj.ending){
    dialogueLines = [ "..." ];
    dialogueWho = "";
    pendingEndingText = STORY.chapters[map.storyIndex].ending;
  } else {
    const ch = STORY.chapters[map.storyIndex];
    const entry = obj.bonus ? ch.bonus : ch.objects[obj.ref];
    dialogueLines = [ entry.text ];
    dialogueWho = obj.bonus ? "✦ Bonus Memory" : ch.subtitle;
  }
  dialogueActive = true;
  dialogueIndex = 0;
  renderDialogueLine();
}

function renderDialogueLine(){
  const box = document.getElementById('dialogueBox');
  box.style.display = 'block';
  document.getElementById('hint').style.display = 'none';
  box.querySelector('.who').textContent = dialogueWho;
  box.querySelector('.text').textContent = dialogueLines[dialogueIndex];
}

function closeDialogue(){
  dialogueActive = false;
  document.getElementById('dialogueBox').style.display = 'none';
  document.getElementById('hint').style.display = 'block';
  if(pendingEndingText !== null){
    triggerEnding(pendingEndingText);
    pendingEndingText = null;
  }
}

function triggerEnding(text){
  gameEnded = true;
  document.getElementById('gameWrap').style.display = 'none';
  document.getElementById('endingText').textContent = text;
  document.getElementById('endingScreen').style.display = 'flex';
}

function tryMove(dir){
  if(dialogueActive || gameEnded) return;
  let dx=0,dy=0;
  if(dir==='up'){dy=-1; player.facing='up';}
  if(dir==='down'){dy=1; player.facing='down';}
  if(dir==='left'){dx=-1; player.facing='left';}
  if(dir==='right'){dx=1; player.facing='right';}
  if(player.moving) return;
  const nx = player.x+dx, ny = player.y+dy;
  if(isBlocked(nx,ny)) return;
  player.x = nx; player.y = ny;
  player.targetPx = nx*TILE; player.targetPy = ny*TILE;
  player.moving = true;
}

function pollMovement(){
  if(keysDown["ArrowUp"]) tryMove('up');
  else if(keysDown["ArrowDown"]) tryMove('down');
  else if(keysDown["ArrowLeft"]) tryMove('left');
  else if(keysDown["ArrowRight"]) tryMove('right');
}

function updatePlayerPixels(){
  const speed = 5;
  if(player.moving){
    if(player.px < player.targetPx) player.px = Math.min(player.px+speed, player.targetPx);
    if(player.px > player.targetPx) player.px = Math.max(player.px-speed, player.targetPx);
    if(player.py < player.targetPy) player.py = Math.min(player.py+speed, player.targetPy);
    if(player.py > player.targetPy) player.py = Math.max(player.py-speed, player.targetPy);
    if(player.px===player.targetPx && player.py===player.targetPy){
      player.moving = false;
      checkExit();
    }
  }
}

let badmintonCompleted = false;

/* =====================================================================
   BADMINTON MINI-GAME — plays once, right after leaving the Front Yard,
   as the start of Chapter 1. Edit the two text lines below if you want.
   ===================================================================== */
const BADMINTON_TEXT = {
  intro: "Remember this? Move with the pad, tap the heart to swing!",
  complete: "[Write here: a line about badminton being part of your story]"
};

const BM = {
  netX: 208, groundY: 240, hitTopY: 168,
  playerHalf: [26, 188], partnerHalf: [228, 390],
  playerX: 92, partnerX: 322,
  shuttle: {x:322, y:180, vx:0, vy:0},
  rally: 0, target: 6,
  paused: 0, message: "", introTimer: 200
};

function startBadminton(){
  mode = 'badminton';
  BM.playerX = 92; BM.partnerX = 322;
  BM.rally = 0; BM.paused = 0; BM.introTimer = 200;
  document.getElementById('bmSkip').style.display = 'block';
  document.getElementById('interactBtn').querySelector('span:last-child').textContent = 'HIT';
  document.getElementById('hint').textContent = 'Move with the pad, tap the heart to swing';
  serveShuttle('partner');
}

function serveShuttle(from){
  if(from==='partner'){
    BM.shuttle.x = BM.partnerX; BM.shuttle.y = 175;
    BM.shuttle.vx = -2.6; BM.shuttle.vy = -4.5;
  } else {
    BM.shuttle.x = BM.playerX; BM.shuttle.y = 175;
    BM.shuttle.vx = 2.6; BM.shuttle.vy = -4.5;
  }
}

function swingRacket(){
  const s = BM.shuttle;
  const inReach = Math.abs(s.x - BM.playerX) < 26 && s.y > BM.hitTopY && s.y < BM.groundY - 4 && s.vx <= 0;
  if(!inReach || BM.paused>0) return;
  const targetX = BM.partnerHalf[0] + Math.random()*(BM.partnerHalf[1]-BM.partnerHalf[0]);
  const T = 46;
  s.vy = -5.4;
  s.vx = (targetX - s.x) / T;
  BM.rally++;
  BM.message = "";
  if(BM.rally >= BM.target){
    completeBadminton();
  }
}

function completeBadminton(){
  BM.message = BADMINTON_TEXT.complete;
  BM.paused = 1000000; // freeze play, wait for the timeout below
  setTimeout(()=>{
    mode = 'world';
    badmintonCompleted = true;
    document.getElementById('bmSkip').style.display = 'none';
    document.getElementById('interactBtn').querySelector('span:last-child').textContent = 'TALK';
    document.getElementById('hint').textContent = 'Use the pad to walk · tap the heart to interact';
    enterMap(1);
  }, 2200);
}

document.getElementById('bmSkip').addEventListener('click', ()=>{
  if(mode==='badminton') completeBadminton();
});

function updateBadminton(){
  if(BM.introTimer > 0) BM.introTimer--;
  if(keysDown["ArrowLeft"])  BM.playerX = Math.max(BM.playerHalf[0], BM.playerX-3.2);
  if(keysDown["ArrowRight"]) BM.playerX = Math.min(BM.playerHalf[1], BM.playerX+3.2);

  if(BM.paused > 0 && BM.paused < 1000000){
    BM.paused--;
    if(BM.paused===0){ serveShuttle('partner'); BM.message=""; }
    return;
  }
  if(BM.paused >= 1000000) return; // frozen for completion message

  const s = BM.shuttle;
  s.vy += 0.12;
  s.x += s.vx; s.y += s.vy;

  // AI partner tracks the shuttle when it's heading their way
  if(s.vx > 0){
    const targetPX = Math.max(BM.partnerHalf[0], Math.min(BM.partnerHalf[1], s.x));
    BM.partnerX += (targetPX - BM.partnerX) * 0.08;
  }
  // AI auto-returns when shuttle is in its reach
  if(s.vx > 0 && Math.abs(s.x-BM.partnerX) < 24 && s.y > BM.hitTopY && s.y < BM.groundY-4){
    const targetX = BM.playerHalf[0] + Math.random()*(BM.playerHalf[1]-BM.playerHalf[0]);
    const T = 46;
    s.vy = -5.2;
    s.vx = (targetX - s.x) / T;
  }

  // missed: shuttle touches the ground
  if(s.y >= BM.groundY){
    if(s.x < BM.netX){
      BM.rally = 0;
      BM.message = "Try again!";
    }
    BM.paused = 45;
  }
}

function drawBadminton(){
  gctx.clearRect(0,0,gameCanvas.width,gameCanvas.height);
  // court
  gctx.fillStyle = "#8fd18a"; gctx.fillRect(0,0,416,288);
  for(let i=0;i<416;i+=32) for(let j=0;j<288;j+=32){ if((i+j)%64===0){ gctx.fillStyle="rgba(255,255,255,0.06)"; gctx.fillRect(i,j,32,32); } }
  gctx.strokeStyle="rgba(255,255,255,0.5)"; gctx.lineWidth=2;
  gctx.beginPath(); gctx.moveTo(10,BM.groundY+6); gctx.lineTo(406,BM.groundY+6); gctx.stroke();

  // net
  gctx.fillStyle="#a9805c"; gctx.fillRect(BM.netX-3, BM.hitTopY-10, 6, BM.groundY-BM.hitTopY+16);
  gctx.fillStyle="rgba(255,255,255,0.75)";
  for(let ny=BM.hitTopY;ny<BM.groundY+4;ny+=8) gctx.fillRect(BM.netX-24, ny, 48, 2);

  // characters (simple friendly blobs using the existing character renderer)
  drawCharacter(gctx, BM.playerX-14.4, BM.groundY-57.6, 1.8, 'right', false);
  drawCharacter(gctx, BM.partnerX-14.4, BM.groundY-57.6, 1.8, 'left', false);

  // shuttle
  const s = BM.shuttle;
  gctx.fillStyle="#fff";
  gctx.beginPath(); gctx.ellipse(s.x, s.y, 4, 4, 0,0,Math.PI*2); gctx.fill();
  gctx.strokeStyle="rgba(255,255,255,0.7)"; gctx.lineWidth=1.5;
  gctx.beginPath(); gctx.moveTo(s.x,s.y-4); gctx.lineTo(s.x,s.y-11); gctx.stroke();

  // rally counter
  gctx.font = "bold 16px 'VT323', monospace";
  gctx.fillStyle = "#2a1a0a";
  gctx.textAlign = "center";
  gctx.fillText(`Rally: ${BM.rally} / ${BM.target}`, 208, 26);
  gctx.textAlign = "start";

  if(BM.introTimer > 0){
    gctx.fillStyle="rgba(20,15,25,0.55)";
    rr(gctx, 40, 110, 336, 40, 10); gctx.fill();
    gctx.fillStyle="#fff"; gctx.font="14px 'VT323', monospace"; gctx.textAlign="center";
    gctx.fillText(BADMINTON_TEXT.intro, 208, 134);
    gctx.textAlign="start";
  }
  if(BM.message && BM.paused < 1000000){
    gctx.fillStyle="#e2557a"; gctx.font="bold 15px 'VT323', monospace"; gctx.textAlign="center";
    gctx.fillText(BM.message, 208, 60);
    gctx.textAlign="start";
  }
  if(BM.paused >= 1000000){
    gctx.fillStyle="rgba(20,15,25,0.75)"; gctx.fillRect(0,0,416,288);
    gctx.fillStyle="#fff"; gctx.font="bold 15px 'VT323', monospace"; gctx.textAlign="center";
    wrapText(gctx, BADMINTON_TEXT.complete, 208, 130, 340, 20);
    gctx.textAlign="start";
  }
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split(' ');
  let line = '';
  let ly = y;
  for(const w of words){
    const test = line + w + ' ';
    if(ctx.measureText(test).width > maxWidth && line){
      ctx.fillText(line, x, ly); line = w + ' '; ly += lineHeight;
    } else line = test;
  }
  ctx.fillText(line, x, ly);
}

function checkExit(){
  const exit = map.exits.find(ex=>ex.x===player.x && ex.y===player.y);
  if(exit){
    if(exit.to === 1 && !badmintonCompleted){
      fadeTransition(()=>{ startBadminton(); });
      return;
    }
    fadeTransition(()=>{ enterMap(exit.to, exit.entry); });
  }
}

function drawTile(x,y,code,colors){
  const px=x*TILE, py=y*TILE;
  if(map.theme === 'indoor'){
    if(code===8){
      gctx.fillStyle = colors.wall; gctx.fillRect(px,py,TILE,TILE);
      gctx.fillStyle = "rgba(255,255,255,0.08)"; gctx.fillRect(px,py,TILE,4);
      return;
    }
    if(code===6){
      gctx.fillStyle = colors.floor; gctx.fillRect(px,py,TILE,TILE);
      gctx.fillStyle = colors.door; rr(gctx, px+4,py+2,TILE-8,TILE-4,6); gctx.fill();
      return;
    }
    if(code===9){
      gctx.fillStyle = "#c9a876"; gctx.fillRect(px,py,TILE,TILE);
      gctx.fillStyle = "#a9825a";
      for(let i=0;i<4;i++){ rr(gctx, px+3, py+i*8+2, TILE-6, 4, 2); gctx.fill(); }
      return;
    }
    gctx.fillStyle = ((x+y)%2===0)?colors.floor:colors.floorAlt;
    gctx.fillRect(px,py,TILE,TILE);
    gctx.strokeStyle = "rgba(255,255,255,0.35)"; gctx.lineWidth = 1.5;
    gctx.beginPath();
    gctx.moveTo(px+TILE/2,py); gctx.lineTo(px+TILE,py+TILE/2);
    gctx.lineTo(px+TILE/2,py+TILE); gctx.lineTo(px,py+TILE/2);
    gctx.closePath(); gctx.stroke();
    return;
  }
  // outdoor base: soft grass
  gctx.fillStyle = ((x+y)%2===0)?colors.grass:colors.grassAlt;
  gctx.fillRect(px,py,TILE,TILE);

  if(code===2){ // blobby tree
    gctx.fillStyle = "rgba(20,25,15,0.15)";
    gctx.beginPath(); gctx.ellipse(px+TILE/2, py+TILE-6, 11, 4, 0,0,Math.PI*2); gctx.fill();
    gctx.fillStyle = colors.trunk;
    rr(gctx, px+TILE/2-3, py+18, 6, 10, 2); gctx.fill();
    gctx.fillStyle = colors.treeDark;
    gctx.beginPath(); gctx.ellipse(px+TILE/2, py+13, 14, 13, 0,0,Math.PI*2); gctx.fill();
    gctx.fillStyle = colors.tree;
    gctx.beginPath(); gctx.ellipse(px+TILE/2-3, py+11, 12, 11, 0,0,Math.PI*2); gctx.fill();
    gctx.fillStyle = "rgba(255,255,255,0.18)";
    gctx.beginPath(); gctx.ellipse(px+TILE/2-6, py+7, 5, 4, 0,0,Math.PI*2); gctx.fill();
    return;
  }
  if(code===3){ // water with soft ripple
    gctx.fillStyle = colors.water; gctx.fillRect(px,py,TILE,TILE);
    gctx.strokeStyle = colors.waterLight; gctx.lineWidth = 2; gctx.lineCap="round";
    gctx.beginPath(); gctx.arc(px+TILE/2, py+TILE/2, 7, 0.9*Math.PI, 1.9*Math.PI); gctx.stroke();
    return;
  }
  if(code===4){ // building wall / roof with windows
    const isRoof = (y===1);
    if(isRoof){
      gctx.fillStyle = "#c1615a";
      rr(gctx, px, py+6, TILE, TILE-6, 6); gctx.fill();
      gctx.fillStyle = "rgba(255,255,255,0.15)";
      gctx.fillRect(px+3,py+7,TILE-6,3);
    } else {
      gctx.fillStyle = "#e3c491";
      rr(gctx, px, py, TILE, TILE, 3); gctx.fill();
      if(x%2===0){
        gctx.fillStyle = "#bfe3ee";
        rr(gctx, px+8, py+8, TILE-16, TILE-16, 4); gctx.fill();
        gctx.strokeStyle = "#8a6a52"; gctx.lineWidth=2;
        rr(gctx, px+8, py+8, TILE-16, TILE-16, 4); gctx.stroke();
        gctx.beginPath(); gctx.moveTo(px+TILE/2,py+8); gctx.lineTo(px+TILE/2,py+TILE-8); gctx.stroke();
      }
    }
    return;
  }
  if(code===6){ // door
    gctx.fillStyle = colors.door;
    rr(gctx, px+3, py+3, TILE-6, TILE-6, 8); gctx.fill();
    gctx.fillStyle = "rgba(0,0,0,0.12)";
    rr(gctx, px+8, py+8, TILE-16, TILE-16, 5); gctx.fill();
    return;
  }
  if(code===1){ // path
    gctx.fillStyle = colors.path;
    rr(gctx, px+1, py+1, TILE-2, TILE-2, 4); gctx.fill();
    return;
  }
  if(code===5){ // flower
    gctx.fillStyle = "#ff9fb5";
    ctxFlower(px+TILE/2, py+TILE/2);
    return;
  }
}

function ctxFlower(cx,cy){
  for(let i=0;i<5;i++){
    const a = (i/5)*Math.PI*2;
    gctx.beginPath();
    gctx.ellipse(cx+Math.cos(a)*4, cy+Math.sin(a)*4, 3, 3, 0,0,Math.PI*2);
    gctx.fill();
  }
  gctx.fillStyle = "#ffe27a";
  gctx.beginPath(); gctx.ellipse(cx,cy,2.4,2.4,0,0,Math.PI*2); gctx.fill();
}

function drawObject(obj){
  const px=obj.x*TILE, py=obj.y*TILE;
  gctx.fillStyle = "rgba(20,15,25,0.15)";
  gctx.beginPath(); gctx.ellipse(px+16, py+27, 12, 4, 0,0,Math.PI*2); gctx.fill();
  gctx.strokeStyle = "#2b2230"; gctx.lineWidth = 1.4;

  if(obj.type==='sign'){
    gctx.fillStyle="#a9805c"; rr(gctx,px+13,py+16,6,14,2); gctx.fill(); gctx.stroke();
    gctx.fillStyle="#e3c491"; rr(gctx,px+4,py+4,24,15,4); gctx.fill(); gctx.stroke();
  } else if(obj.type==='bench'){
    gctx.fillStyle="#a9805c"; rr(gctx,px+3,py+10,26,7,3); gctx.fill(); gctx.stroke();
    gctx.fillStyle="#c9a06a"; rr(gctx,px+3,py+16,26,6,3); gctx.fill(); gctx.stroke();
    gctx.fillStyle="#8a6a52"; rr(gctx,px+3,py+21,4,7,2); gctx.fill(); gctx.stroke(); rr(gctx,px+25,py+21,4,7,2); gctx.fill(); gctx.stroke();
  } else if(obj.type==='heart'){
    gctx.fillStyle="#ff6f91";
    gctx.beginPath(); gctx.ellipse(px+12,py+13,6.5,6.5,0,0,Math.PI*2); gctx.fill(); gctx.stroke();
    gctx.beginPath(); gctx.ellipse(px+20,py+13,6.5,6.5,0,0,Math.PI*2); gctx.fill(); gctx.stroke();
    gctx.beginPath();
    gctx.moveTo(px+6,py+15); gctx.lineTo(px+16,py+27); gctx.lineTo(px+26,py+15);
    gctx.closePath(); gctx.fill(); gctx.stroke();
  }
}

let debugCollision = false;
document.getElementById('debugToggle').addEventListener('click', ()=>{
  debugCollision = !debugCollision;
  document.getElementById('debugToggle').style.opacity = debugCollision ? 1 : 0.55;
  document.getElementById('debugToggle').textContent = debugCollision ? "hide blocked areas" : "show blocked areas (debug)";
});

function draw(){
  const colors = map.theme === 'indoor' ? THEME_COLORS.indoor : THEME_COLORS[map.theme];
  gctx.clearRect(0,0,gameCanvas.width,gameCanvas.height);

  const viewW = gameCanvas.width, viewH = gameCanvas.height;
  let camX = player.px + TILE/2 - viewW/2;
  let camY = player.py + TILE/2 - viewH/2;
  camX = Math.max(0, Math.min(camX, map.w*TILE - viewW));
  camY = Math.max(0, Math.min(camY, map.h*TILE - viewH));
  if(map.w*TILE < viewW) camX = -(viewW - map.w*TILE)/2;
  if(map.h*TILE < viewH) camY = -(viewH - map.h*TILE)/2;

  gctx.save();
  gctx.translate(-camX, -camY);

  if(map.customBg){
    if(FRONTYARD_BG.complete) gctx.drawImage(FRONTYARD_BG, 0, 0, map.w*TILE, map.h*TILE);
    // subtle glow on door/exit tiles so they're findable without looking like UI clutter
    for(let ty=0;ty<map.h;ty++) for(let tx=0;tx<map.w;tx++){
      if(map.grid[ty][tx]===6){
        const px=tx*TILE, py=ty*TILE;
        const glow = gctx.createRadialGradient(px+16,py+16,2,px+16,py+16,16);
        glow.addColorStop(0,"rgba(255,240,200,0.35)");
        glow.addColorStop(1,"rgba(255,240,200,0)");
        gctx.fillStyle = glow;
        gctx.fillRect(px-4,py-4,TILE+8,TILE+8);
      }
    }
    const flowerImg = flowerImgs[flowerFrameIndex];
    if(flowerImg && flowerImg.complete){
      FRONTYARD_FLOWERS.forEach(f=>{ gctx.drawImage(flowerImg, f.x, f.y, 48, 48); });
    }
  } else {
    for(let y=0;y<map.h;y++) for(let x=0;x<map.w;x++) drawTile(x,y,map.grid[y][x],colors);
  }

  map.objs.forEach(drawObject);
  drawCharacter(gctx, player.px, player.py-32, 2, player.facing, player.moving);
  drawNameTag(gctx, player.px+16, player.py-34, "You");

  if(debugCollision){
    for(let y=0;y<map.h;y++) for(let x=0;x<map.w;x++){
      if(isBlocked(x,y)){
        gctx.fillStyle = "rgba(220,40,40,0.4)";
        gctx.fillRect(x*TILE, y*TILE, TILE, TILE);
        gctx.strokeStyle = "rgba(220,40,40,0.8)";
        gctx.strokeRect(x*TILE+1, y*TILE+1, TILE-2, TILE-2);
      }
    }
  }

  gctx.restore();
}

let mode = 'world'; // 'world' | 'badminton'

function loop(){
  if(mode === 'badminton'){
    updateBadminton();
    drawBadminton();
  } else {
    pollMovement();
    updatePlayerPixels();
    draw();
  }
  requestAnimationFrame(loop);
}

/* ---------------- Touch controls wiring ---------------- */
function bindHold(el, onDown, onUp){
  const down = e=>{ e.preventDefault(); el.classList.add('pressed'); onDown(); };
  const up = e=>{ e.preventDefault(); el.classList.remove('pressed'); onUp(); };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointerleave', up);
  el.addEventListener('pointercancel', up);
}
bindHold(document.getElementById('dbtn-up'),    ()=>keysDown["ArrowUp"]=true,    ()=>keysDown["ArrowUp"]=false);
bindHold(document.getElementById('dbtn-down'),  ()=>keysDown["ArrowDown"]=true,  ()=>keysDown["ArrowDown"]=false);
bindHold(document.getElementById('dbtn-left'),  ()=>keysDown["ArrowLeft"]=true,  ()=>keysDown["ArrowLeft"]=false);
bindHold(document.getElementById('dbtn-right'), ()=>keysDown["ArrowRight"]=true, ()=>keysDown["ArrowRight"]=false);
document.getElementById('interactBtn').addEventListener('pointerdown', e=>{ e.preventDefault(); handleSpace(); });

/* ---------------- Start the game immediately ---------------- */
document.getElementById('gameWrap').style.display = 'flex';
document.getElementById('touchControls').style.display = 'flex';
gameCanvas = document.getElementById('gameCanvas');
gctx = gameCanvas.getContext('2d');
enterMap(0);
loop();
</script>
